services:
  # Backend API
  - type: web
    name: urbanmind-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
    healthCheckPath: /

  # Frontend (Static Site)
  - type: web
    name: urbanmind-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://urbanmind-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
